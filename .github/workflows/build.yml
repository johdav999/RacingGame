name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Public WebEngine needs no extra token. For a private engine configure
          # an approved read-only cross-repository credential; see development.md.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Validate provider helpers without network calls
        run: python scripts/dev.py check-skills
      - name: Native integration
        run: python scripts/dev.py native
      - name: Install pinned Emscripten
        run: python scripts/dev.py setup
      - name: Browser build
        run: python scripts/dev.py build
      - uses: actions/upload-artifact@v4
        with:
          name: racinggame-browser
          path: build/web/site
          if-no-files-found: error
