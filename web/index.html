<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RacingGame · Development garage</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101722;color:#f1f4f8;font:16px system-ui}
  main{max-width:1100px;margin:0 auto;padding:24px}h1{font-size:clamp(24px,5vw,40px);margin-bottom:8px}
  p{line-height:1.5;color:#bcc8d7}#viewport{width:100%;height:65vh;min-height:280px;display:block;border:1px solid #40526b;border-radius:12px}
  a{color:#9cd1ff}nav{display:flex;gap:20px;flex-wrap:wrap;margin:16px 0}
</style>
<main>
  <h1>RacingGame</h1>
  <p>Development garage · WebEngine integration starter. Driving and racing will be built here.</p>
  <nav aria-label="Renderer"><a href="?renderer=auto">Automatic</a><a href="?renderer=webgpu">WebGPU</a><a href="?renderer=webgl2">WebGL 2</a></nav>
  <canvas id="viewport" aria-label="Preview of a placeholder car on a garage floor"></canvas>
  <p id="status" role="status">Loading engine…</p>
</main>
<script>
window.engineStatus = (message) => {
  document.getElementById('status').textContent = message;
};
window.engineStats = (meshes, lights, layers) => {
  window.racingStats = {meshes, lights, layers};
};
window.enginePerformance = (snapshot) => {
  window.racingPerformance = snapshot;
};
var Module = {
  canvas: document.getElementById('viewport'),
  printErr: message => console.error(message),
  onAbort: message => { document.getElementById('status').textContent = 'Engine failed to load: ' + message; }
};
window.addEventListener('error', event => {
  document.getElementById('status').textContent = 'Loading error: ' + event.message;
});
</script>
<script src="racing.js"></script>
</html>
